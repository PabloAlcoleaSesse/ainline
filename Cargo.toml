[package]
name = "ainline"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Direct AI provider CLI with project context"
license = "MIT"
readme = "README.md"
repository = "https://github.com/PabloAlcoleaSesse/ainline"
homepage = "https://github.com/PabloAlcoleaSesse/ainline"
exclude = ["dist/", ".ai/", ".env", ".env.*"]
keywords = ["ai", "cli", "terminal", "ollama", "context"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
which = "8"
dirs = "7"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
