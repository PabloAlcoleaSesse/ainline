[package]
name = "ainline"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Direct AI provider CLI with project context"
license = "MIT"
readme = "README.md"
repository = "https://github.com/PabloAlcoleaSesse/ainline"
homepage = "https://github.com/PabloAlcoleaSesse/ainline"
exclude = ["dist/", ".ai/", ".env", ".env.*"]
keywords = ["ai", "cli", "terminal", "ollama", "context"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
which = "8"
dirs = "7"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
