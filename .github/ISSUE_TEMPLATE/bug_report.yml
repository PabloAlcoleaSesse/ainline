name: Bug report
description: Report a reproducible problem with ai.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include tokens, credentials, private rules, or confidential source code. Use the Security tab for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: ai version or commit
      placeholder: Output of ai --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, shell and provider CLI version
      placeholder: macOS ARM64, zsh, copilot version ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and a minimal command
      description: Use a sanitized prompt and config. Say whether the native provider command also fails.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include sanitized stderr and the exit code.
    validations:
      required: true
