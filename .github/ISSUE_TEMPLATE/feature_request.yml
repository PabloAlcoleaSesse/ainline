name: Feature request
description: Propose a focused improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What workflow is difficult today?
      description: Describe the task, who needs it, and your current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: A concrete example command and expected output help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
