name: Native provider contracts
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  help-contracts:
    name: ${{ matrix.provider }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - provider: claude
            package: '@anthropic-ai/claude-code'
            version: '2.1.224'
          - provider: copilot
            package: '@github/copilot'
            version: '1.0.80'
          - provider: openai
            package: '@openai/codex'
            version: '0.162.0'
        provider: [claude, copilot, openai]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned provider
        shell: bash
        run: npm install --global '${{ matrix.package }}@${{ matrix.version }}'
      - name: Check native version and help contract (no model request)
        run: python scripts/check-providers.py --provider ${{ matrix.provider }} --expected-version ${{ matrix.version }} --strict
