name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ai
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: ai
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: ai
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ai.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Package binary and documentation
        run: python scripts/package-release.py ${{ matrix.target }} ${{ matrix.bin }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ai-* > SHA256SUMS
      - name: Create an alpha release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --generate-notes
