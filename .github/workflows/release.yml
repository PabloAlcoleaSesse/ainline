name: Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ai
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: ai
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: ai
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ai.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"], "Tag must match Cargo version"'
      - name: Install target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Package binary and documentation
        run: python scripts/package-release.py ${{ matrix.target }} ${{ matrix.bin }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp scripts/install.py dist/install.py
          cp scripts/install.sh dist/install.sh
          python3 scripts/release-metadata.py "$RELEASE_TAG"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f "docs/releases/$RELEASE_TAG.md"
          gh release create "$RELEASE_TAG" dist/* --verify-tag --latest --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
