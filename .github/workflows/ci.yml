name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets
      - name: Verify installer and release metadata
        run: python -m unittest discover -s scripts/tests -v
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Smoke-test the release binary
        shell: bash
        env:
          AI_CONFIG_FILE: ${{ runner.temp }}/ainline-smoke/config.yaml
        run: |
          ./target/release/ai --version
          ./target/release/ai cl hk4.5 --dry-run --no-context hello
          ./target/release/ai models cl
  msrv:
    name: Minimum Rust 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --locked --all-targets
