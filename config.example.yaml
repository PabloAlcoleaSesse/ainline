# Used by ai <message>; an explicit provider overrides it.
default_provider: claude
# Optional profiles: ai --profile 2 <message>; alias ai2='ai --profile 2'.
# Quote numeric profile names. Instructions stay active with --no-context.
profiles:
  '2':
    provider: claude
    model: hk4.5
    instructions: Review code for correctness and explain edge cases.
# Select any key explicitly: ai <key> [flags] <message>.
# Built-in providers are available even when this file contains only custom aliases.
models:
  claude:
    provider: claude
    binary: claude
    model: sonnet
  copilot:
    provider: copilot
    binary: copilot
    model: claude-haiku-4.5
  antigravity:
    provider: antigravity
    binary: agy
    model: gemini-3.1-pro-high
  openai:
    provider: openai
    binary: codex
    model: default # use Codex's configured/default model
  ollama:
    provider: ollama
    binary: ollama
    model: qwen2.5-coder:7b
  local-review:
    provider: ollama
    binary: ollama
    model: qwen2.5-coder:7b

# Optional overrides/extensions. Unspecified built-in codes remain available.
# Keys here are full provider kinds, not two-letter shortcuts or custom aliases.
model_aliases:
  claude:
    hk4.5: claude-haiku-4-5-20251001
    sn4.5: claude-sonnet-4-5-20250929
    op4.5: claude-opus-4-5-20251101
  copilot:
    hk4.5: claude-haiku-4.5
  antigravity:
    gp3.1: gemini-3.1-pro-high
  openai: {} # Add your own model codes for models available in Codex.
  ollama:
    qw2.5: qwen2.5-coder:7b
